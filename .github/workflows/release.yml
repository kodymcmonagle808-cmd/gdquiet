name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt
      - name: Bake release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import json, os, re; from pathlib import Path; ver = os.environ['RELEASE_TAG'].lstrip('vV'); p = Path('app/updater.py'); p.write_text(re.sub(r'^APP_VERSION = .*$', 'APP_VERSION = ' + json.dumps(ver), p.read_text(encoding='utf-8'), flags=re.M), encoding='utf-8')"
      - name: Bake Supabase settings for Discord sign-in
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: python -c "import json, os, re; from pathlib import Path; p = Path('app/supabase_config.py'); s = p.read_text(encoding='utf-8'); s = re.sub(r'^SUPABASE_URL = .*$', 'SUPABASE_URL = ' + json.dumps(os.environ.get('SUPABASE_URL', '').strip()), s, flags=re.M); s = re.sub(r'^SUPABASE_KEY = .*$', 'SUPABASE_KEY = ' + json.dumps(os.environ.get('SUPABASE_KEY', '').strip()), s, flags=re.M); p.write_text(s, encoding='utf-8'); print('Supabase configured:', bool(os.environ.get('SUPABASE_URL')) and bool(os.environ.get('SUPABASE_KEY')))"
      - run: python -m unittest discover -s tests -v
      - name: Build GDQuiet.exe
        run: pyinstaller --onefile --noconsole --name GDQuiet --icon app/assets/gdquiet.ico --add-data "logo.png;." --add-data "app/assets/gdquiet.ico;assets" --add-data "app/ui;ui" --paths app --hidden-import web_ui --collect-submodules winrt --collect-binaries winrt --collect-data winrt --collect-submodules pystray --collect-all webview --collect-all pythonnet --collect-all clr_loader --hidden-import=PIL._tkinter_finder app/gdquiet.py
      - name: Build GDQuiet-Setup.exe Wizard
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ver = if ($env:RELEASE_TAG -and $env:RELEASE_TAG.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
            $env:RELEASE_TAG.Substring(1)
          } else {
            (python -c "import sys; sys.path.insert(0, 'app'); import updater; print(updater.APP_VERSION)").Trim()
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
          if (-not $iscc) {
            foreach ($cand in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:LocalAppData\Programs\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $cand) { $iscc = $cand; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$ver" installer/gdquiet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract patch notes
        shell: pwsh
        run: |
          $notes = python -c "import sys; sys.path.insert(0, 'app'); from updater import PATCH_NOTES; print(PATCH_NOTES)"
          $notes | Out-File -FilePath dist/patch_notes.txt -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            dist/GDQuiet-Setup.exe
            dist/patch_notes.txt

  release:
    needs: [app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out
      - name: Build release body
        shell: bash
        run: |
          NOTES=""
          if [ -f out/patch_notes.txt ]; then
            NOTES=$(cat out/patch_notes.txt)
          fi
          {
            if [ -n "$NOTES" ]; then
              echo "### What's New"
              echo ""
              echo "$NOTES"
              echo ""
            fi
            echo "---"
            echo ""
            echo "### Install GD Quiet"
            echo "Download and run **\`GDQuiet-Setup.exe\`** to open the Windows Setup Wizard (review and accept terms, choose your install location and shortcuts, then launch GD Quiet)."
          } > out/release_body.md
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: out/release_body.md
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          # Only the installer is published. Never attach the standalone GDQuiet.exe.
          files: |
            out/GDQuiet-Setup.exe
